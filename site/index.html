<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send To Manyfold</title>
<meta name="color-scheme" content="light dark">
<style>
:root { --bg: #ffffff; --fg: #1d2330; --muted: #566074; --link: #0b5cad; --rule: #d6dbe4; }
@media (prefers-color-scheme: dark) { :root { --bg: #14171f; --fg: #e6e9f0; --muted: #a3acbf; --link: #7db4f0; --rule: #333a49; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.6 system-ui, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
a { color: var(--link); }
p.note { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Send To Manyfold</h1>
  <p>A Chrome extension that sends 3D models from Printables, Thingiverse and MakerWorld to your own Manyfold library.</p>
  <ul>
    <li><a href="privacy/">Privacy policy</a></li>
    <li><a href="https://github.com/jackalopes/send-to-manyfold">Source code and README</a></li>
    <li><a href="https://github.com/jackalopes/send-to-manyfold/issues">Report a problem</a></li>
  </ul>
  <p class="note">Unofficial. Not affiliated with Manyfold, Printables, Thingiverse or MakerWorld.</p>
</main>
</body>
</html>
